<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { font-family: Arial, sans-serif; background: #5bc8f5; }

  #sky {
    width: 100vw; min-height: 100vh;
    background: linear-gradient(180deg, #5bc8f5 0%, #a8e4ff 100%);
    transition: background 0.6s;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 0;
  }

  #title-bar {
    font-size: 16px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  /* The wheel is a single SVG that fills the width */
  #wheel-svg {
    width: 92vw;
    max-width: 420px;
    height: 92vw;
    max-height: 420px;
    cursor: pointer;
  }

  /* Detail view */
  #detail {
    display: none; flex-direction: column; align-items: center;
    gap: 12px; padding: 10px 24px 20px; width: 100%;
  }
  #detail-svg { width: 180px; height: 160px; }
  #detail-name { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.25); }
  #detail-desc {
    font-size: 13px; color: #fff; text-align: center; line-height: 1.65;
    background: rgba(255,255,255,0.25); border-radius: 14px; padding: 12px 16px;
    max-width: 340px;
  }
  #btn-back {
    padding: 9px 26px; border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.3); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div id="sky">
  <div id="title-bar">¿Cómo te sentís hoy?</div>
  <svg id="wheel-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="detail">
    <svg id="detail-svg" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="detail-name"></div>
    <div id="detail-desc"></div>
    <button id="btn-back">← Volver</button>
  </div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const mel = t => document.createElementNS(NS, t);
const sa = (el, a) => { Object.entries(a).forEach(([k,v]) => el.setAttribute(k,v)); return el; };
const ap = (p, el) => { p.appendChild(el); return el; };

function mpath(p,d,stroke,sw,fill,ex) {
  return ap(p,sa(mel('path'),{d,stroke:stroke||'none','stroke-width':sw||2,fill:fill||'none','stroke-linecap':'round','stroke-linejoin':'round',...(ex||{})}));
}
function mcirc(p,cx,cy,r,fill) { return ap(p,sa(mel('circle'),{cx,cy,r,fill})); }
function mtxt(p,t,x,y,fs,fill,fw) {
  const e=sa(mel('text'),{x,y,'font-size':fs,fill,'font-weight':fw||'700','text-anchor':'middle','font-family':'Arial,sans-serif'});
  e.textContent=t; return ap(p,e);
}
function dotEye(p,x,y,r) { mcirc(p,x,y,r,'#2a2a2a'); mcirc(p,x-r*.4,y-r*.4,r*.35,'white'); }
function happyEye(p,x,y,r) { mpath(p,`M${x-r} ${y} Q${x} ${y-r*1.5} ${x+r} ${y}`,'#2a2a2a',2.5); }

// Cloud drawn in a local 100x85 space, then placed via SVG transform
function drawCloud(g, emo) {
  const cd = 'M17,56 Q10,56 9,50 Q8,44 14,41 Q12,33 20,29 Q22,21 32,21 Q34,14 43,13 Q53,12 57,19 Q64,15 72,21 Q83,21 84,29 Q91,33 88,41 Q95,44 93,50 Q91,57 82,56 Z';
  ap(g, sa(mel('ellipse'),{cx:50,cy:62,rx:31,ry:4,fill:'rgba(0,0,0,0.08)'}));
  if (emo.accessory) emo.accessory(g);
  mpath(g, cd, emo.stroke||'#c8d8e8', 1.8, emo.fill||'white');
  mpath(g,'M32,22 Q28,19 32,18 Q38,15 41,19','rgba(255,255,255,0.9)',2);
  emo.face(g);
}

// ── Emotions ──────────────────────────────────────────────
const E = [
  { nombre:'Felicidad', color:'#FFD93D', sky:['#5bc8f5','#a8e4ff'],
    desc:'La felicidad es una emoción cálida de bienestar y satisfacción. Surge cuando algo nos genera alegría y amor, impulsándonos a conectar con los demás.',
    accessory(g) {
      ['#FF4444','#FF9900','#FFE600','#44CC44','#4488FF','#9944FF'].forEach((c,i)=>{
        const r=18-i*2.5;
        ap(g,sa(mel('path'),{d:`M82,${22+i*3.5} A${r},${r} 0 0,1 82,${22+i*3.5+r*2}`,stroke:c,'stroke-width':3,fill:'none','stroke-linecap':'round'}));
      });
    },
    face(g) {
      happyEye(g,39,37,3.5); happyEye(g,61,37,3.5);
      mpath(g,'M41,44 Q50,52 59,44','#2a2a2a',1.5);
      [34,64].forEach((x,i)=>ap(g,sa(mel('ellipse'),{cx:x+(i?-1:1),cy:45,rx:5,ry:3,fill:'#ffaaaa',opacity:.75})));
    }
  },
  { nombre:'Tristeza', color:'#74B9FF', sky:['#6888a8','#a8c0d8'],
    desc:'La tristeza aparece ante pérdidas o decepciones. Nos invita a pausar, reflexionar y buscar consuelo en quienes nos rodean.',
    accessory(g) {
      [[32,61],[39,65],[46,61],[53,65],[60,61],[36,71],[52,71]].forEach(([x,y])=>{
        mpath(g,`M${x},${y} Q${x-1},${y+4} ${x},${y+6.5}`,'#88b8e0',1.5,'none');
      });
    },
    face(g) {
      dotEye(g,40,36,3); dotEye(g,60,36,3);
      mpath(g,'M42,49 Q50,44 58,49','#2a2a2a',1.5);
      ap(g,sa(mel('path'),{d:'M41,39 Q39,43 41,46',stroke:'#6aacdc','stroke-width':1.5,fill:'none','stroke-linecap':'round'}));
    }
  },
  { nombre:'Enojo', color:'#A8A8A8', fill:'#d4d4d4', stroke:'#999', sky:['#b06040','#e09870'],
    desc:'El enojo es una respuesta ante algo injusto o amenazante. Nos da energía para defender nuestros límites y valores.',
    accessory(g) {
      [[34,61],[42,63],[52,61],[61,63]].forEach(([x,y])=>{
        mpath(g,`M${x},${y} l-2.5,5 2,-1 -2.5,5`,'#f0c000',1.8);
      });
    },
    face(g) {
      mpath(g,'M35,32 L44,36','#666',1.8); mpath(g,'M65,32 L56,36','#666',1.8);
      dotEye(g,40,38,3); dotEye(g,60,38,3);
      mpath(g,'M42,47 Q50,44 58,47','#555',1.5);
    }
  },
  { nombre:'Ira', color:'#636363', fill:'#b0b0b0', stroke:'#777', sky:['#902020','#c05050'],
    desc:'La ira es la forma más intensa del enojo. Reconocerla a tiempo permite canalizarla de forma constructiva.',
    accessory(g) {
      [[31,60],[42,63],[52,60],[65,63]].forEach(([x,y])=>{
        mpath(g,`M${x},${y} l-3.5,7 3,-1.5 -3.5,7`,'#ff2200',2.2);
      });
    },
    face(g) {
      mpath(g,'M33,31 L45,37','#cc0000',2.2); mpath(g,'M67,31 L55,37','#cc0000',2.2);
      mcirc(g,40,39,3.5,'#2a2a2a'); mcirc(g,60,39,3.5,'#2a2a2a');
      mcirc(g,38.5,37.5,1.2,'white'); mcirc(g,58.5,37.5,1.2,'white');
      mpath(g,'M41,47 L59,47','#555',1.2);
      [[41,45],[46,51],[51,45],[56,51]].forEach(([a,b])=>{
        mpath(g,`M${a},47 L${a},50 L${b},50 L${b},47`,'#555',1,'white');
      });
    }
  },
  { nombre:'Neutral', color:'#B2BEC3', sky:['#6090b0','#a0c4da'],
    desc:'El estado neutral es un punto de equilibrio emocional donde la mente está tranquila y abierta.',
    accessory(g) {},
    face(g) {
      dotEye(g,40,37,3); dotEye(g,60,37,3);
      mpath(g,'M42,47 L58,47','#2a2a2a',1.8);
    }
  },
  { nombre:'Irritación', color:'#FDCB6E', sky:['#b07828','#e0b858'],
    desc:'La irritación es una incomodidad persistente. Es señal de que algo necesita cambiar o de que estamos llegando a nuestro límite.',
    accessory(g) {
      [[13,30],[85,29],[24,64],[76,63]].forEach(([x,y],i)=>{
        const r=i%2===0?1:-1;
        mpath(g,`M${x},${y} l${2.5*r},-3 ${-2*r},0.5 ${2.5*r},-3`,'#f08800',1.3);
      });
    },
    face(g) {
      mpath(g,'M35,33 L44,37','#2a2a2a',1.5); mpath(g,'M65,33 L56,37','#2a2a2a',1.5);
      dotEye(g,40,39,3); dotEye(g,60,39,3);
      mpath(g,'M43,47 Q50,44 57,47','#2a2a2a',1.5);
      [[42,19],[50,16],[58,19]].forEach(([x,y])=>{
        mpath(g,`M${x},${y} Q${x+2},${y-3.5} ${x},${y-7}`,'#ff8800',1.3,'none',{opacity:.8});
      });
    }
  },
  { nombre:'Ansioso', color:'#A29BFE', sky:['#6048a8','#a090d8'],
    desc:'La ansiedad es una preocupación anticipatoria sobre el futuro. Respirar profundo y enfocarse en el presente puede ayudar.',
    accessory(g) {
      [['?',31,66],['!',40,69],['?',50,66],['!',60,69],['?',69,66]].forEach(([c,x,y])=>{
        mtxt(g,c,x,y,8,'#7840c8','900');
      });
    },
    face(g) {
      [40,60].forEach(x=>{ mcirc(g,x,37,4,'#2a2a2a'); mcirc(g,x-1.5,35.5,1.5,'white'); });
      mpath(g,'M42,46 Q46,43 49,46 Q52,49 58,46','#2a2a2a',1.5);
      ap(g,sa(mel('path'),{d:'M69,32 Q67,35.5 69,39',stroke:'#88ccee','stroke-width':1.5,fill:'none','stroke-linecap':'round'}));
    }
  },
  { nombre:'Asustado', color:'#55EFC4', sky:['#306850','#70b898'],
    desc:'El miedo es una respuesta de protección ante algo percibido como peligroso. Identificar qué nos asusta es el primer paso para enfrentarlo.',
    accessory(g) {
      [[28,64],[37,68],[49,65],[58,68],[68,64],[32,73],[63,73]].forEach(([x,y])=>{
        mtxt(g,'*',x,y,7.5,'#a0d8f0','900');
      });
    },
    face(g) {
      [40,60].forEach(x=>{ mcirc(g,x,36,5,'#2a2a2a'); mcirc(g,x-2,34,2,'white'); });
      ap(g,sa(mel('ellipse'),{cx:50,cy:47,rx:6,ry:4.5,fill:'#2a2a2a'}));
      ap(g,sa(mel('ellipse'),{cx:50,cy:47,rx:4.5,ry:3,fill:'#883333'}));
    }
  },
  { nombre:'Apático', color:'#DFE6E9', sky:['#708068','#a8b898'],
    desc:'La apatía es una falta de interés o motivación. Pequeñas acciones cotidianas pueden ayudar a recuperar la energía.',
    accessory(g) {
      mtxt(g,'z',64,24,6.5,'#8898a8','700');
      mtxt(g,'Z',70,17,8.5,'#8898a8','700');
      mtxt(g,'Z',78,9,11,'#8898a8','700');
    },
    face(g) {
      // half-closed eyes
      [40,60].forEach((cx,i)=>{
        const id='slc'+(i+ Math.floor(Math.random()*9999));
        const defs=ap(g,mel('defs'));
        const cp=ap(defs,mel('clipPath')); cp.setAttribute('id',id);
        ap(cp,sa(mel('rect'),{x:cx-5,y:34,width:10,height:5}));
        ap(g,sa(mel('circle'),{cx,cy:38,r:5,fill:'#2a2a2a','clip-path':`url(#${id})`}));
      });
      mpath(g,'M43,47 L57,47','#2a2a2a',1.8);
    }
  },
  { nombre:'Pacífico', color:'#81ECEC', sky:['#282858','#5060a8'],
    desc:'La paz interior es una sensación de calma y armonía que nutre el bienestar y nos permite estar presentes con serenidad.',
    accessory(g) {
      mpath(g,'M76,25 a9,9 0 1,0 0,18 a6,6 0 1,1 0,-18','none',0,'#ffe090');
      [[27,25],[33,19],[20,38],[39,66],[56,67],[48,71]].forEach(([x,y],i)=>{
        mtxt(g,i<3?'★':'✦',x,y,i<3?5:4,'#ffe090','700');
      });
    },
    face(g) {
      happyEye(g,40,37,3.5); happyEye(g,60,37,3.5);
      mpath(g,'M42,44 Q50,52 58,44','#2a2a2a',1.5);
      [33,64].forEach((x,i)=>ap(g,sa(mel('ellipse'),{cx:x+(i?-1:1),cy:45,rx:5,ry:3,fill:'#ffaaaa',opacity:.6})));
    }
  },
  { nombre:'Bromista', color:'#FD79A8', sky:['#b07010','#e0b840'],
    desc:'El estado bromista surge de la ligereza y el humor. Nos ayuda a no tomarnos todo tan en serio y a conectar con otros de forma lúdica.',
    accessory(g) {
      [['★',20,28,'#ff5050'],['★',81,29,'#4488ff'],['✦',27,65,'#ff9900'],['✦',74,64,'#44cc44']].forEach(([c,x,y,col])=>mtxt(g,c,x,y,6.5,col,'700'));
      [[36,69,'#ff4488'],[44,72,'#f0c000'],[54,70.5,'#44cccc'],[62,68,'#ff8844']].forEach(([x,y,c])=>mcirc(g,x,y,2.2,c));
    },
    face(g) {
      mpath(g,'M36,37 Q40,33 44,37','#2a2a2a',1.4);
      dotEye(g,60,37,3.2);
      mpath(g,'M41,44 Q50,53 59,44 Z','none',0,'white');
      mpath(g,'M41,44 Q50,52 59,44','#2a2a2a',1.5);
      [35,63].forEach((x,i)=>ap(g,sa(mel('ellipse'),{cx:x+(i?-1:1),cy:46,rx:5,ry:3,fill:'#ffaaaa',opacity:.65})));
    }
  },
  { nombre:'Desamparado', color:'#6C5CE7', sky:['#404868','#7880b0'],
    desc:'El desamparo aparece cuando sentimos que perdemos el control. Recordar que no estamos solos puede aliviar esta emoción.',
    accessory(g) {
      [[31,61],[38,65],[46,61],[54,65],[62,61],[35,71],[51,72],[65,71]].forEach(([x,y])=>{
        mpath(g,`M${x},${y} L${x-1.5},${y+7}`,'#7090c8',1.2,'none');
      });
    },
    face(g) {
      dotEye(g,40,37,3); dotEye(g,60,37,3);
      mpath(g,'M42,48 Q50,43 58,48','#2a2a2a',1.5);
      [[40,40],[60,40]].forEach(([x,y])=>{
        ap(g,sa(mel('path'),{d:`M${x},${y} Q${x-2},${y+4.5} ${x},${y+8.5}`,stroke:'#6888c8','stroke-width':1.8,fill:'none','stroke-linecap':'round'}));
      });
    }
  }
];

// ── Build the wheel SVG ───────────────────────────────────
const wheelSVG = document.getElementById('wheel-svg');
const N = E.length;
const CX = 250, CY = 250, R = 200; // in viewBox units (500x500)

// dashed ring
const ring = sa(mel('circle'),{cx:CX,cy:CY,r:R,fill:'rgba(255,255,255,0.1)',stroke:'rgba(255,255,255,0.35)','stroke-width':1.5,'stroke-dasharray':'8 5'});
wheelSVG.appendChild(ring);

E.forEach((e,i) => {
  const angle = (i/N)*2*Math.PI - Math.PI/2;
  const x = CX + R*Math.cos(angle);
  const y = CY + R*Math.sin(angle);

  // colored dot
  mcirc(wheelSVG, x, y, 38, e.color);

  // cloud group scaled & translated
  const g = ap(wheelSVG, sa(mel('g'),{transform:`translate(${x-50},${y-42}) scale(1)`}));
  g.style.cursor = 'pointer';
  drawCloud(g, e);

  // label
  mtxt(wheelSVG, e.nombre, x, y+52, 13, '#fff', '700');

  // invisible hit area
  const hit = sa(mel('circle'),{cx:x,cy:y,r:45,fill:'transparent'});
  hit.style.cursor='pointer';
  hit.addEventListener('click',()=>showDetail(e));
  wheelSVG.appendChild(hit);
});

// ── Detail ────────────────────────────────────────────────
const sky = document.getElementById('sky');
const titleBar = document.getElementById('title-bar');
const detailEl = document.getElementById('detail');
const dsvg = document.getElementById('detail-svg');
const dname = document.getElementById('detail-name');
const ddesc = document.getElementById('detail-desc');

function showDetail(e) {
  wheelSVG.style.display='none'; titleBar.style.display='none';
  detailEl.style.display='flex';
  sky.style.background=`linear-gradient(180deg,${e.sky[0]} 0%,${e.sky[1]} 100%)`;
  dsvg.innerHTML='';
  // draw big version
  const g2=ap(dsvg,sa(mel('g'),{transform:'translate(0,0) scale(2)'}));
  drawCloud(g2,e);
  dname.textContent=e.nombre; ddesc.textContent=e.desc;
}

document.getElementById('btn-back').addEventListener('click',()=>{
  detailEl.style.display='none';
  wheelSVG.style.display=''; titleBar.style.display='';
  sky.style.background='linear-gradient(180deg,#5bc8f5 0%,#a8e4ff 100%)';
});
</script>
</body>
</html>
