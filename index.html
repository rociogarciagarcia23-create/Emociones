<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: transparent; }

  #sky {
    width: 100vw; height: 100vh; border-radius: 0;
    background: linear-gradient(180deg, #5bc8f5 0%, #a8e4ff 100%);
    transition: background 0.6s;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  #title-bar {
    font-size: 14px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    margin-top: 12px; z-index: 10;
  }

  /* WHEEL */
  #wheel {
    position: relative;
    width: 90vw; height: 90vw;
    max-width: 390px; max-height: 390px;
    margin-top: 8px;
    flex-shrink: 0;
  }

  /* Each cloud button placed absolutely via JS */
  .cloud-btn {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    background: none; border: none; cursor: pointer;
    transform: translate(-50%, -50%);
    transition: transform 0.15s; z-index: 5;
  }
  .cloud-btn:hover { transform: translate(-50%, -50%) scale(1.2); z-index: 20; }
  .cloud-btn svg { width: 60px; height: 50px; display: block; }
  .cloud-label {
    font-size: 9px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    white-space: nowrap; margin-top: 1px;
  }

  /* Center decorative ring drawn on canvas */
  #ring-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

  /* DETAIL */
  #detail {
    display: none; flex-direction: column; align-items: center;
    gap: 10px; padding: 10px 20px 16px; width: 100%;
  }
  #detail svg { width: 160px; height: 140px; }
  #detail-name { font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.25); }
  #detail-desc {
    font-size: 12px; color: #fff; text-align: center; line-height: 1.6;
    background: rgba(255,255,255,0.25); border-radius: 14px; padding: 10px 14px;
  }
  #btn-back {
    padding: 7px 22px; border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.3); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #btn-back:hover { background: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div id="sky">
  <div id="title-bar">¿Cómo te sentís hoy?</div>
  <div id="wheel">
    <canvas id="ring-canvas" width="320" height="320"></canvas>
  </div>
  <div id="detail">
    <svg id="dsvg" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="detail-name"></div>
    <div id="detail-desc"></div>
    <button id="btn-back">← Volver</button>
  </div>
</div>

<script>
// Draw dashed ring on canvas
const canvas = document.getElementById('ring-canvas');
const ctx = canvas.getContext('2d');
ctx.strokeStyle = 'rgba(255,255,255,0.4)';
ctx.lineWidth = 1.5;
ctx.setLineDash([6, 4]);
ctx.beginPath();
ctx.arc(160, 160, 118, 0, Math.PI*2);
ctx.stroke();

// ── SVG helpers ──────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const mel = t => document.createElementNS(NS, t);
const sa = (el, a) => { Object.entries(a).forEach(([k,v]) => el.setAttribute(k,v)); return el; };
const ap = (p, el) => { p.appendChild(el); return el; };
function mpath(p, d, stroke, sw, fill, ex) {
  return ap(p, sa(mel('path'), {d, stroke:stroke||'none','stroke-width':sw||2, fill:fill||'none','stroke-linecap':'round','stroke-linejoin':'round',...(ex||{})}));
}
function mcirc(p, cx, cy, r, fill) { return ap(p, sa(mel('circle'),{cx,cy,r,fill})); }
function mtxt(p, t, x, y, fs, fill, fw) {
  const e = sa(mel('text'),{x,y,'font-size':fs,fill,'font-weight':fw||'700','text-anchor':'middle','font-family':'Arial,sans-serif'});
  e.textContent = t; return ap(p, e);
}
function dotEye(p, x, y, r) { mcirc(p,x,y,r,'#2a2a2a'); mcirc(p,x-r*.4,y-r*.4,r*.35,'white'); }
function happyEye(p, x, y, r) { mpath(p,`M${x-r} ${y} Q${x} ${y-r*1.5} ${x+r} ${y}`,'#2a2a2a',2.5); }

// Cloud shape (200×170 space) — face area centered ~y=80
function cpath() {
  return 'M35,112 Q22,112 20,100 Q17,87 30,82 Q25,65 42,58 Q46,42 65,42 Q69,27 88,25 Q107,23 114,37 Q130,30 146,42 Q164,42 167,58 Q180,65 174,82 Q187,87 183,100 Q179,113 165,112 Z';
}

function drawCloud(svg, emo) {
  const cd = cpath();
  // shadow
  ap(svg, sa(mel('ellipse'),{cx:100,cy:120,rx:62,ry:7,fill:'rgba(0,0,0,0.08)'}));
  // accessory behind
  if (emo.accessory) emo.accessory(svg);
  // cloud body
  mpath(svg, cd, emo.stroke||'#c8d8e8', 3, emo.fill||'white');
  // shine
  mpath(svg,'M65,43 Q58,38 65,35 Q76,30 82,37','rgba(255,255,255,0.9)',3.5);
  // face
  emo.face(svg);
}

function mkSVG(emo, w, h) {
  const svg = sa(mel('svg'),{viewBox:`0 0 200 170`,xmlns:NS,width:'100%',height:'100%'});
  drawCloud(svg, emo);
  return svg;
}

// ── Emotion data ──────────────────────────────────────────
const E = [
  { nombre:'Felicidad', color:'#FFD93D', sky:['#5bc8f5','#a8e4ff'],
    desc:'La felicidad es una emoción cálida de bienestar y satisfacción. Surge cuando algo nos genera alegría y amor, impulsándonos a conectar con los demás.',
    accessory(s) {
      // Rainbow: vertical arcs curving to the right from the cloud's right edge
      ['#FF4444','#FF9900','#FFE600','#44CC44','#4488FF','#9944FF'].forEach((c,i)=>{
        const r = 38 - i*5;
        const x0 = 162, y0 = 58 + i*7;
        const x1 = 162, y1 = y0 + r*2;
        ap(s, sa(mel('path'),{
          d:`M${x0},${y0} A${r},${r} 0 0,1 ${x1},${y1}`,
          stroke:c,'stroke-width':6,fill:'none','stroke-linecap':'round'
        }));
      });
    },
    face(s) {
      happyEye(s,78,73,7); happyEye(s,122,73,7);
      mpath(s,'M82,88 Q100,104 118,88','#2a2a2a',3);
      [68,128].forEach((x,i)=>ap(s,sa(mel('ellipse'),{cx:x+(i?-2:2),cy:90,rx:10,ry:6,fill:'#ffaaaa',opacity:.75})));
    }
  },
  { nombre:'Tristeza', color:'#74B9FF', sky:['#6888a8','#a8c0d8'],
    desc:'La tristeza aparece ante pérdidas o decepciones. Nos invita a pausar, reflexionar y buscar consuelo en quienes nos rodean.',
    accessory(s) {
      [[65,122],[80,130],[95,122],[110,130],[125,122],[72,142],[108,142]].forEach(([x,y])=>{
        mpath(s,`M${x},${y} Q${x-2},${y+8} ${x},${y+13}`,'#88b8e0',3,'none');
      });
    },
    face(s) {
      dotEye(s,80,73,6); dotEye(s,120,73,6);
      mpath(s,'M85,98 Q100,89 115,98','#2a2a2a',3);
      ap(s,sa(mel('path'),{d:'M82,78 Q79,86 82,91',stroke:'#6aacdc','stroke-width':3,fill:'none','stroke-linecap':'round'}));
    }
  },
  { nombre:'Enojo', color:'#A8A8A8', fill:'#d4d4d4', stroke:'#999', sky:['#b06040','#e09870'],
    desc:'El enojo es una respuesta ante algo injusto o amenazante. Nos da energía para defender nuestros límites y valores.',
    accessory(s) {
      [[68,122],[86,128],[104,122],[122,128]].forEach(([x,y])=>{
        mpath(s,`M${x},${y} l-5,10 4,-2 -5,10`,'#f0c000',3.5);
      });
    },
    face(s) {
      mpath(s,'M70,65 L88,72','#666',3.5); mpath(s,'M130,65 L112,72','#666',3.5);
      dotEye(s,80,77,6); dotEye(s,120,77,6);
      mpath(s,'M85,95 Q100,88 115,95','#555',3);
    }
  },
  { nombre:'Ira', color:'#636363', fill:'#b0b0b0', stroke:'#777', sky:['#902020','#c05050'],
    desc:'La ira es la forma más intensa del enojo. Reconocerla a tiempo permite canalizarla de forma constructiva antes de que nuble el juicio.',
    accessory(s) {
      [[62,120],[84,126],[106,120],[128,126]].forEach(([x,y])=>{
        mpath(s,`M${x},${y} l-7,14 6,-3 -7,14`,'#ff2200',4.5);
      });
    },
    face(s) {
      mpath(s,'M66,63 L90,73','#cc0000',4.5); mpath(s,'M134,63 L110,73','#cc0000',4.5);
      mcirc(s,80,78,7,'#2a2a2a'); mcirc(s,120,78,7,'#2a2a2a');
      mcirc(s,77,75,2.5,'white'); mcirc(s,117,75,2.5,'white');
      mpath(s,'M82,94 L118,94','#555',2.5);
      [[82,92],[92,102],[102,92],[112,102]].forEach(([a,b])=>{
        mpath(s,`M${a},94 L${a},100 L${b},100 L${b},94`,'#555',2,'white');
      });
    }
  },
  { nombre:'Neutral', color:'#B2BEC3', sky:['#6090b0','#a0c4da'],
    desc:'El estado neutral es un punto de equilibrio emocional donde la mente está tranquila y abierta para tomar decisiones con claridad.',
    accessory(s) {},
    face(s) {
      dotEye(s,80,74,6); dotEye(s,120,74,6);
      mpath(s,'M85,93 L115,93','#2a2a2a',3.5);
    }
  },
  { nombre:'Irritación', color:'#FDCB6E', sky:['#b07828','#e0b858'],
    desc:'La irritación es una incomodidad persistente. Es señal de que algo necesita cambiar o de que estamos llegando a nuestro límite.',
    accessory(s) {
      [[27,60],[168,58],[48,128],[152,126]].forEach(([x,y],i)=>{
        const r=i%2===0?1:-1;
        mpath(s,`M${x},${y} l${5*r},-6 ${-4*r},1 ${5*r},-6`,'#f08800',2.5);
      });
    },
    face(s) {
      mpath(s,'M70,67 L88,74','#2a2a2a',3); mpath(s,'M130,67 L112,74','#2a2a2a',3);
      dotEye(s,80,78,6); dotEye(s,120,78,6);
      mpath(s,'M86,95 Q100,90 114,95','#2a2a2a',3);
      [[84,38],[100,33],[116,38]].forEach(([x,y])=>{
        mpath(s,`M${x},${y} Q${x+4},${y-7} ${x},${y-14}`,'#ff8800',2.5,'none',{opacity:.8});
      });
    }
  },
  { nombre:'Ansioso', color:'#A29BFE', sky:['#6048a8','#a090d8'],
    desc:'La ansiedad es una preocupación anticipatoria sobre el futuro. Respirar profundo y enfocarse en el presente puede ayudar a calmarla.',
    accessory(s) {
      [['?',62,132],['!',80,138],['?',100,132],['!',120,138],['?',138,132]].forEach(([c,x,y])=>{
        mtxt(s,c,x,y,16,'#7840c8','900');
      });
    },
    face(s) {
      [80,120].forEach(x=>{mcirc(s,x,74,8,'#2a2a2a'); mcirc(s,x-3,71,3,'white');});
      mpath(s,'M84,92 Q90,87 97,92 Q104,97 116,92','#2a2a2a',3);
      ap(s,sa(mel('path'),{d:'M138,64 Q134,71 138,77',stroke:'#88ccee','stroke-width':3,fill:'none','stroke-linecap':'round'}));
    }
  },
  { nombre:'Asustado', color:'#55EFC4', sky:['#306850','#70b898'],
    desc:'El miedo es una respuesta de protección ante algo percibido como peligroso. Identificar qué nos asusta es el primer paso para enfrentarlo.',
    accessory(s) {
      [[57,128],[75,136],[97,130],[117,136],[137,128],[65,145],[127,145]].forEach(([x,y])=>{
        mtxt(s,'*',x,y,15,'#a0d8f0','900');
      });
    },
    face(s) {
      [80,120].forEach(x=>{mcirc(s,x,72,10,'#2a2a2a'); mcirc(s,x-4,68,4,'white');});
      ap(s,sa(mel('ellipse'),{cx:100,cy:95,rx:12,ry:9,fill:'#2a2a2a'}));
      ap(s,sa(mel('ellipse'),{cx:100,cy:95,rx:9,ry:6,fill:'#883333'}));
    }
  },
  { nombre:'Apático', color:'#DFE6E9', sky:['#708068','#a8b898'],
    desc:'La apatía es una falta de interés o motivación. Pequeñas acciones cotidianas pueden ayudar a recuperar energía cuando estamos agotados.',
    accessory(s) {
      mtxt(s,'z',128,48,13,'#8898a8','700');
      mtxt(s,'Z',141,35,17,'#8898a8','700');
      mtxt(s,'Z',157,20,22,'#8898a8','700');
    },
    face(s) {
      // half closed eyes via clip
      [[80,'sc1'],[120,'sc2']].forEach(([cx,id])=>{
        const defs=ap(s,mel('defs'));
        const cp=ap(defs,mel('clipPath')); cp.setAttribute('id',id);
        ap(cp,sa(mel('rect'),{x:cx-10,y:68,width:20,height:10}));
        ap(s,sa(mel('circle'),{cx,cy:77,r:8,fill:'#2a2a2a','clip-path':`url(#${id})`}));
      });
      mpath(s,'M87,94 L113,94','#2a2a2a',3.5);
    }
  },
  { nombre:'Pacífico', color:'#81ECEC', sky:['#282858','#5060a8'],
    desc:'La paz interior es una sensación de calma y armonía que nutre el bienestar y nos permite estar presentes con serenidad.',
    accessory(s) {
      mpath(s,'M152,50 a18,18 0 1,0 0,36 a12,12 0 1,1 0,-36','none',0,'#ffe090');
      [[54,50],[67,38],[40,76],[78,132],[112,134],[95,142]].forEach(([x,y],i)=>{
        mtxt(s,i<3?'★':'✦',x,y,i<3?10:8,'#ffe090','700');
      });
    },
    face(s) {
      happyEye(s,80,75,7); happyEye(s,120,75,7);
      mpath(s,'M84,89 Q100,103 116,89','#2a2a2a',3);
      [68,128].forEach((x,i)=>ap(s,sa(mel('ellipse'),{cx:x+(i?-2:2),cy:91,rx:10,ry:6,fill:'#ffaaaa',opacity:.6})));
    }
  },
  { nombre:'Bromista', color:'#FD79A8', sky:['#b07010','#e0b840'],
    desc:'El estado bromista surge de la ligereza y el humor. Nos ayuda a no tomarnos todo tan en serio y a conectar con otros de forma lúdica.',
    accessory(s) {
      [['★',40,56,'#ff5050'],['★',162,58,'#4488ff'],['✦',54,130,'#ff9900'],['✦',148,128,'#44cc44']].forEach(([c,x,y,col])=>mtxt(s,c,x,y,13,col,'700'));
      [[72,138,'#ff4488'],[88,144,'#f0c000'],[108,141,'#44cccc'],[124,136,'#ff8844']].forEach(([x,y,c])=>mcirc(s,x,y,4.5,c));
    },
    face(s) {
      mpath(s,'M72,74 Q80,67 88,74','#2a2a2a',2.8);
      dotEye(s,120,74,6.5);
      mpath(s,'M83,89 Q100,106 117,89 Z','none',0,'white');
      mpath(s,'M83,89 Q100,104 117,89','#2a2a2a',3);
      [70,126].forEach((x,i)=>ap(s,sa(mel('ellipse'),{cx:x+(i?-2:2),cy:92,rx:10,ry:6,fill:'#ffaaaa',opacity:.65})));
    }
  },
  { nombre:'Desamparado', color:'#6C5CE7', sky:['#404868','#7880b0'],
    desc:'El desamparo aparece cuando sentimos que perdemos el control. Recordar que no estamos solos puede aliviar esta emoción tan pesada.',
    accessory(s) {
      [[62,122],[78,130],[94,122],[110,130],[126,122],[70,142],[102,145],[130,142]].forEach(([x,y])=>{
        mpath(s,`M${x},${y} L${x-3},${y+14}`,'#7090c8',2.5,'none');
      });
    },
    face(s) {
      dotEye(s,80,73,6); dotEye(s,120,73,6);
      mpath(s,'M85,97 Q100,88 115,97','#2a2a2a',3);
      [[80,79],[116,79]].forEach(([x,y])=>{
        ap(s,sa(mel('path'),{d:`M${x},${y} Q${x-4},${y+9} ${x},${y+17}`,stroke:'#6888c8','stroke-width':3.5,fill:'none','stroke-linecap':'round'}));
      });
    }
  }
];

// ── Build wheel ───────────────────────────────────────────
const wheel = document.getElementById('wheel');
const N = E.length;
const CX = 160, CY = 160, R = 118; // center and radius in px

E.forEach((e, i) => {
  const angle = (i / N) * 2 * Math.PI - Math.PI / 2;
  const x = CX + R * Math.cos(angle);
  const y = CY + R * Math.sin(angle);

  const btn = document.createElement('button');
  btn.className = 'cloud-btn';
  btn.style.left = x + 'px';
  btn.style.top  = y + 'px';

  // colored circle behind
  const dot = document.createElementNS(NS,'svg');
  dot.setAttribute('width','56'); dot.setAttribute('height','56');
  dot.setAttribute('viewBox','-28 -28 56 56');
  dot.style.position='absolute';
  dot.style.left='50%'; dot.style.top='50%';
  dot.style.transform='translate(-50%,-50%)';
  dot.style.zIndex='-1';
  const dc = document.createElementNS(NS,'circle');
  dc.setAttribute('cx',0); dc.setAttribute('cy',0); dc.setAttribute('r',22);
  dc.setAttribute('fill', e.color); dc.setAttribute('opacity','0.85');
  dot.appendChild(dc);
  btn.appendChild(dot);

  const svg = mkSVG(e);
  svg.setAttribute('class','cloud-svg');
  btn.appendChild(svg);

  const lbl = document.createElement('span');
  lbl.className = 'cloud-label';
  lbl.textContent = e.nombre;
  btn.appendChild(lbl);

  btn.addEventListener('click', () => showDetail(e));
  wheel.appendChild(btn);
});

// ── Detail view ───────────────────────────────────────────
const sky = document.getElementById('sky');
const titleBar = document.getElementById('title-bar');
const detailEl = document.getElementById('detail');
const dsvg = document.getElementById('dsvg');
const dname = document.getElementById('detail-name');
const ddesc = document.getElementById('detail-desc');

function showDetail(e) {
  wheelEl.style.display = 'none';
  titleBar.style.display = 'none';
  detailEl.style.display = 'flex';
  sky.style.background = `linear-gradient(180deg,${e.sky[0]} 0%,${e.sky[1]} 100%)`;
  dsvg.innerHTML = '';
  drawCloud(dsvg, e);
  dname.textContent = e.nombre;
  ddesc.textContent = e.desc;
}

document.getElementById('btn-back').addEventListener('click', () => {
  detailEl.style.display = 'none';
  wheelEl.style.display = 'block';
  titleBar.style.display = '';
  sky.style.background = 'linear-gradient(180deg,#5bc8f5 0%,#a8e4ff 100%)';
});
</script>
</body>
</html>
